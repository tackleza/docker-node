name: docker-node-builder

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Refresh supported bases daily at midnight UTC.

permissions:
  contents: read

concurrency:
  group: docker-node-builder
  cancel-in-progress: false

jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: printf '%s' "$DOCKER_HUB_TOKEN" | docker login -u tackleza --password-stdin

      - name: Build, verify and push supported Node images
        run: sh build-supported.sh --push
